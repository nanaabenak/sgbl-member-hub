# /etc/nginx/conf.d/memberhub.conf
# Replace memberhub.club.example with your DNS name before using.

server {
    listen 80;
    server_name memberhub.club.example;

    # Let's Encrypt validation; remove after the certificate is issued if you prefer.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name memberhub.club.example;

    ssl_certificate     /etc/letsencrypt/live/memberhub.club.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memberhub.club.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;

    # Gunicorn application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # The EXISTING Builder Card website, unchanged, served alongside the hub.
    # Copy AWSBuildersBadge---UMaT/ to /opt/memberhub/builder-card/ on the server.
    location /card/ {
        alias /opt/memberhub/builder-card/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

