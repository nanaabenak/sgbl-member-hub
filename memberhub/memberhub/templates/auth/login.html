{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block anon_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="panel green">
      <div class="pixel-rule"></div>
      <h1>Welcome back, builder.</h1>
      <p style="margin:0;opacity:.85">Sign in to track sessions, tasks and learning.</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="field">Username or email
        <input name="identity" autocomplete="username" required autofocus value="{{ request.form.get('identity','') }}">
      </label>
      <label class="field">Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">sign in ▸</button>
    </form>
    <div class="auth-foot">New here? <a href="{{ url_for('auth.register') }}">create a member account</a></div>
  </div>
</div>
{% endblock %}
{% block content %}{% endblock %}
