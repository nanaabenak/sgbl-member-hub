# /etc/nginx/conf.d/memberhub.conf
# Temporary HTTP bootstrap config used until certbot issues a certificate.
# Replace memberhub.club.example with your DNS name (deploy.sh does this).

server {
    listen 80;
    server_name memberhub.club.example;

    # Let's Encrypt validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 2m;

    # Gunicorn application.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # The EXISTING Builder Card website, unchanged, served alongside the hub.
    location /card/ {
        alias /opt/memberhub/builder-card/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
